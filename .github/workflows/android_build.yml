name: Android Quality & Reviewers

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

jobs:
  validation-and-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v41
        with:
          separator: ","
          files: |
            **/*.kt
            **/*.kts

      - name: Run Detekt
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          ./gradlew detekt -PdetektFiles="${{ steps.changed-files.outputs.all_changed_files }}"

      - name: Run Android Lint
        run: ./gradlew lintDebug

      - name: Add Reviewers
        uses: madrapps/add-reviewers@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          reviewers: johnkenedyneves,LucasSimoesMartins
          re-request-when-approved: true
          re-request-when-changes-requested: true